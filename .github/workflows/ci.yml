name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Frontend Tests and Build
  frontend:
    name: Frontend Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type Check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000

  # Backend Tests
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Python syntax
        run: |
          python -m py_compile app/main.py
          python -m py_compile app/config.py
          python -m py_compile app/db.py
          python -m py_compile app/schemas.py
          echo "✅ All Python files have valid syntax"

      - name: Check FastAPI app structure
        run: |
          python -c "
          import sys
          sys.path.insert(0, '.')
          from app.config import settings
          print('✅ Config module loads successfully')
          from app.schemas import ProjectSummary
          print('✅ Schemas module loads successfully')
          from app.db import get_db
          print('✅ Database module loads successfully')
          "

  # Docker Build Test
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [frontend, backend]

    steps:
      - uses: actions/checkout@v4

      - name: Build Backend Docker Image
        run: docker build -t ciousten-backend ./backend

      - name: Build Frontend Docker Image
        run: docker build -t ciousten-frontend ./frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000

      - name: Test Docker Compose
        run: |
          docker-compose config
          echo "✅ Docker Compose configuration is valid"
