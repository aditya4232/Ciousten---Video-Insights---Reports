name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Frontend Build Test
  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://ciousten-video-insights-reports.onrender.com

      - name: Build Success
        run: echo "✅ Frontend build successful!"

  # Backend Syntax Check
  backend:
    name: Backend Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install core dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pydantic pydantic-settings python-dotenv fastapi

      - name: Check Python syntax
        run: |
          python -m py_compile app/main.py
          python -m py_compile app/config.py
          python -m py_compile app/db.py
          python -m py_compile app/schemas.py
          echo "✅ All Python files have valid syntax"
