name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Frontend Tests and Build
  frontend:
    name: Frontend Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type Check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000

  # Backend Tests
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check module imports
        run: |
          python -c "from app.main import app; print('✅ FastAPI app imports successfully')"
          python -c "from app.core.yolo_engine import YOLOEngine; print('✅ YOLO engine imports successfully')"
          python -c "from app.core.openrouter_client import OpenRouterClient; print('✅ OpenRouter client imports successfully')"

  # Docker Build Test
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [frontend, backend]

    steps:
      - uses: actions/checkout@v4

      - name: Build Backend Docker Image
        run: docker build -t ciousten-backend ./backend

      - name: Build Frontend Docker Image
        run: docker build -t ciousten-frontend ./frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000

      - name: Test Docker Compose
        run: |
          docker-compose config
          echo "✅ Docker Compose configuration is valid"
